<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anas Naseem Bold Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout idea: flat colour blocks, thick black borders and hard offset shadows.
   One huge headline in the hero, then bordered cards in a few bright colours. */
:root {
  /* Colors (light) */
  --bg: #F4F0E6;        /* cream page */
  --ink: #000000;       /* text, borders, shadows */
  --paper: #FFFFFF;     /* white cards, inputs */
  --hl: #FF5A4D;        /* red highlight */
  --y: #FFE14D;         /* yellow */
  --sky: #7DD3FC;       /* blue */
  --mint: #86EFAC;      /* green */
  --on-color: #000000;  /* text on the bright colours, same in both themes */
  /* Fonts */
  --font-display: "Archivo Black", "Arial Black", Impact, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #17150F; --ink: #F4F0E6; --paper: #26231B; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #17150F; --ink: #F4F0E6; --paper: #26231B; color-scheme: dark; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
/* Paints the area above the sticky bar (phone status bar) */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 50; }
a { color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1; margin: 0; text-wrap: balance; text-transform: uppercase; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--hl); outline-offset: 3px; }

/* Side gutter: set once on the wrapper */
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- Top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); border-bottom: 3px solid var(--ink); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding-block: 12px; }
.brand { background: var(--ink); color: var(--bg); font: 400 16px var(--font-display); text-transform: uppercase; padding: 8px 14px; text-decoration: none; margin-right: auto; }
.nav { order: 3; width: 100%; overflow-x: auto; scrollbar-width: none; padding: 2px 6px 8px 2px; }
.nav::-webkit-scrollbar { display: none; }
.nav ul { display: flex; gap: 10px; list-style: none; margin: 0; padding: 0; white-space: nowrap; }
.chipbtn, .nav a {
  display: inline-block; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  padding: 5px 12px; font: 700 14px var(--font-body); text-decoration: none; cursor: pointer;
}
.nav a:hover, .chipbtn:hover { background: var(--y); color: var(--on-color); }
.chipbtn:active, .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
@media (min-width: 900px) { .nav { order: 0; width: auto; padding: 0 4px 0 0; } .bar { flex-wrap: nowrap; } .brand { margin-right: 0; } .bar .nav { margin-left: auto; } }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; border: 3px solid var(--ink);
  font: 700 15px var(--font-body); text-transform: uppercase; letter-spacing: 0.02em; text-decoration: none; cursor: pointer;
  box-shadow: 4px 4px 0 var(--ink); transition: transform 0.1s, box-shadow 0.1s;
}
.btn.dark { background: var(--ink); color: var(--bg); }
.btn.light { background: var(--paper); color: var(--ink); }
.btn.hot { background: var(--hl); color: var(--on-color); }
.btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
.btn.small { padding: 7px 14px; font-size: 13px; box-shadow: 3px 3px 0 var(--ink); }

/* ---------- Sections ---------- */
section { padding-block: 72px; scroll-margin-top: 90px; border-bottom: 3px solid var(--ink); }
.sec-head { display: grid; gap: 14px; margin-bottom: 36px; justify-items: start; }
.sec-head h2 { font-size: clamp(2rem, 5.5vw, 3.4rem); }
.sec-head p { max-width: 60ch; font-weight: 500; }
.tag { display: inline-block; background: var(--ink); color: var(--bg); font: 700 12px var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 10px; }
.sub { font: 400 1.3rem var(--font-display); text-transform: uppercase; margin: 44px 0 18px; }

/* ---------- Home ---------- */
#home { padding-block: 56px 72px; }
.hero { display: grid; gap: 40px; align-items: center; }
@media (min-width: 960px) { .hero { grid-template-columns: 1.6fr 1fr; gap: 56px; } }
.hero h1 { font-size: clamp(2.7rem, 9.5vw, 6.4rem); line-height: 0.95; letter-spacing: -0.03em; }
.hl { display: inline-block; background: var(--hl); color: var(--on-color); border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 0 0.12em; transform: rotate(-1.5deg); margin-block: 0.06em; }
.tagline { font: 700 clamp(1rem, 2.4vw, 1.3rem) var(--font-body); margin-top: 26px; max-width: 46ch; }
.intro { margin-top: 12px; max-width: 54ch; font-weight: 500; }
.roles { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.role { background: var(--paper); border: 3px solid var(--ink); padding: 3px 12px; font: 700 13px var(--font-mono); }
.cta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 30px; }
.social { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 26px; font-weight: 700; }
.social a { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 4px; }
.social a:hover { background: var(--y); color: var(--on-color); }
.sticker { justify-self: center; width: min(100%, 300px); background: var(--y); color: var(--on-color); border: 4px solid var(--ink); box-shadow: 10px 10px 0 var(--ink); transform: rotate(2deg); }
.sticker .pic { aspect-ratio: 1; display: grid; place-items: center; font: 400 5rem var(--font-display); border-bottom: 4px solid var(--ink); overflow: hidden; background: var(--sky); }
.sticker .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sticker .cap { padding: 12px 14px; font: 700 14px var(--font-mono); display: flex; align-items: center; gap: 10px; }
.sticker .cap i { width: 12px; height: 12px; border-radius: 50%; background: #16A34A; border: 2px solid #000; flex: none; }

/* ---------- Cards ---------- */
.grid { display: grid; gap: 26px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.card { border: 4px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; background: var(--paper); color: var(--ink); }
.card.c-y { background: var(--y); color: var(--on-color); }
.card.c-sky { background: var(--sky); color: var(--on-color); }
.card.c-mint { background: var(--mint); color: var(--on-color); }
.card.c-hot { background: var(--hl); color: var(--on-color); }
.card h3 { font-size: 1.45rem; line-height: 1.05; }
.card .desc { font-weight: 500; }
.meta { display: grid; gap: 10px; border-top: 3px solid currentColor; padding-top: 12px; font-size: 14.5px; }
.meta-label { display: block; font: 700 11px var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.75; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
.chip { font: 700 12.5px var(--font-mono); background: var(--paper); color: var(--ink); border: 2px solid var(--ink); padding: 2px 9px; }
.card .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: auto; padding-top: 4px; }
.card .btn.dark { background: #000; color: #fff; border-color: #000; }
.card .btn.light { background: #fff; color: #000; border-color: #000; }
.card .btn { box-shadow: 3px 3px 0 #000; }

/* ---------- Skills ---------- */
.skill-card h3 { font-size: 1.1rem; }

/* ---------- About ---------- */
.about { display: grid; gap: 36px; }
@media (min-width: 900px) { .about { grid-template-columns: 1.3fr 1fr; gap: 56px; } }
.about .text { display: grid; gap: 16px; font-size: 1.05rem; font-weight: 500; max-width: 62ch; min-width: 0; }
.facts { margin: 0; border: 4px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); background: var(--paper); align-self: start; }
.facts div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 16px; border-bottom: 3px solid var(--ink); }
.facts div:last-child { border-bottom: 0; }
.facts dt { font: 700 12px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; }
.facts dd { margin: 0; text-align: right; font-weight: 600; }
.focus { margin-top: 44px; }

/* ---------- Certificates ---------- */
.cert-img { aspect-ratio: 16 / 10; max-width: 100%; border: 3px dashed currentColor; display: grid; place-items: center; font: 700 13px var(--font-mono); overflow: hidden; background: var(--paper); color: var(--ink); }
.cert-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
.cert-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-weight: 600; font-size: 14.5px; }

/* ---------- Education / experience ---------- */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 26px; }
.job h3 { font-size: 1.35rem; }
.job .when { font: 700 13px var(--font-mono); }
.job .org { font-weight: 700; }
.job ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-weight: 500; }
.job .tag { margin-left: 0; width: fit-content; }

/* ---------- Contact ---------- */
.contact { display: grid; gap: 30px; }
@media (min-width: 900px) { .contact { grid-template-columns: 1fr 1.2fr; gap: 40px; } }
.contact-list { display: grid; gap: 20px; align-content: start; }
.contact-list .row { display: grid; gap: 4px; }
.contact-list .label { font: 700 12px var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; }
.copy-line { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.copy-line code { font: 700 15px var(--font-mono); user-select: all; overflow-wrap: anywhere; }
.contact-list a { font-weight: 700; overflow-wrap: anywhere; }
form { display: grid; gap: 18px; }
.field { display: grid; gap: 6px; }
.field label { font: 700 13px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; }
.field input, .field textarea { width: 100%; font: 500 16px var(--font-body); color: var(--ink); background: var(--paper); border: 3px solid var(--ink); padding: 11px 14px; border-radius: 0; }
.field textarea { min-height: 140px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: 3px solid var(--hl); outline-offset: 2px; }
.form-note { font-weight: 600; min-height: 1.4em; font-size: 14.5px; }
.form-note.error { color: #B91C1C; }
:root[data-theme="dark"] .form-note.error { color: #FF8A7A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .form-note.error { color: #FF8A7A; } }
.form-actions { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }

footer { background: var(--ink); color: var(--bg); padding-block: 26px; font: 700 14px var(--font-mono); }
</style>

</head>

<header class="top">

    <button class="chipbtn" id="theme-btn" type="button" aria-label="Switch between light and dark theme">Theme</button>
  </div>
</header>

<main>
  <section id="home">
    <div class="wrap hero">
      <div>
        <h1 id="home-title"></h1>

        <div class="cap"><i></i><span id="status-text"></span></div>
      </div>
    </div>
  </section>

  <section id="about">
    <div class="wrap">
      <div class="sec-head"><span class="tag">About</span><h2 id="about-title"></h2></div>
      <div class="about">
        <div class="text" id="about-text"></div>
        <dl class="facts" id="about-facts"></dl>
      </div>
      <div class="focus grid" id="about-focus"></div>
    </div>
  </section>

  <section id="skills">
    <div class="wrap">
      <div class="sec-head"><span class="tag">Skills</span><h2>Tools I use</h2></div>
      <div class="grid" id="skills-grid"></div>
    </div>
  </section>

  <section id="projects">
    <div class="wrap">
      <div class="sec-head"><span class="tag">Work</span><h2>Projects</h2></div>
      <div class="grid" id="projects-grid"></div>
    </div>
  </section>

  <section id="certificates">
    <div class="wrap">
      <div class="sec-head"><span class="tag">Certificates</span><h2>Certificates</h2></div>
      <h3 class="sub" style="margin-top:0">Python</h3>
      <div class="grid" id="certs-python"></div>
      <h3 class="sub">Other</h3>
      <div class="grid" id="certs-other"></div>
    </div>
  </section>

  <section id="experience">
    <div class="wrap">
      <div class="sec-head"><span class="tag">Education</span><h2>Education and experience</h2></div>
      <ol class="timeline grid" id="experience-list"></ol>
    </div>
  </section>

  <section id="contact">
    <div class="wrap">
      <div class="sec-head"><span class="tag">Contact</span><h2 id="contact-title"></h2><p id="contact-lead"></p></div>
      <div class="contact">
        <div class="contact-list" id="contact-list"></div>
        <form id="contact-form" novalidate>
          <div class="field"><label for="f-name">Your name</label><input id="f-name" name="name" type="text" autocomplete="name" required></div>
          <div class="field"><label for="f-email">Your email</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="f-message">Message</label><textarea id="f-message" name="message" required></textarea></div>
          <div class="form-actions">
            <button class="btn hot" type="submit">Send message</button>
            <button class="btn light" type="button" id="copy-msg" hidden>Copy message</button>
          </div>
          <p class="form-note" id="form-note" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </section>
</main>

<footer><div class="wrap" id="footer-left"></div></footer>

// Make an element: el("a", { href: "..." }, "text or child")
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const key in (attrs || {})) {
    if (key === "class") node.className = attrs[key];
    else node.setAttribute(key, attrs[key]);
  }
  for (const child of children) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return node;
}

// Only allow normal web links, so a typo cannot create an unsafe link
function safeUrl(url) { return /^https?:\/\//i.test(url || "") ? url : ""; }

// Make a link button, or nothing if the link is empty
function linkButton(label, url, style) {
  const href = safeUrl(url);
  if (!href) return null;
  return el("a", { class: "btn small " + (style || "light"), href: href, target: "_blank", rel: "noopener noreferrer" }, label);
}

function fillChips(items) {
  const list = el("ul", { class: "chips" });
  items.forEach(item => list.append(el("li", { class: "chip" }, item)));
  return list;
}

// Card colours take turns: yellow, white, blue, green
const COLORS = ["c-y", "", "c-sky", "c-mint"];
function colorClass(i) { return COLORS[i % COLORS.length]; }

const initials = CONFIG.name.split(" ").filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");

// ----- Top bar and footer -----
document.getElementById("brand").textContent = CONFIG.name;
document.getElementById("footer-left").textContent = "© " + new Date().getFullYear() + " " + CONFIG.name;

// ----- Home -----
const title = document.getElementById("home-title");
title.append(CONFIG.headline.before, el("br"), el("span", { class: "hl" }, CONFIG.headline.highlight), " ", CONFIG.headline.after);
document.getElementById("home-tagline").textContent = CONFIG.tagline;
document.getElementById("home-intro").textContent = CONFIG.intro;
const roleBox = document.getElementById("home-roles");
CONFIG.roles.forEach(r => roleBox.append(el("span", { class: "role" }, r)));

// Photo, or initials if no photo link is set
const avatar = document.getElementById("avatar");
const photoUrl = safeUrl(CONFIG.photo);
if (photoUrl) avatar.append(el("img", { src: photoUrl, alt: "Photo of " + CONFIG.name }));
else avatar.textContent = initials;
if (CONFIG.status) document.getElementById("status-text").textContent = CONFIG.status;
else document.querySelector(".sticker .cap").hidden = true;

const social = document.getElementById("home-social");
[["GitHub", CONFIG.links.github], ["LinkedIn", CONFIG.links.linkedin]].forEach(pair => {
  const href = safeUrl(pair[1]);
  if (href) social.append(el("a", { href: href, target: "_blank", rel: "noopener noreferrer" }, pair[0]));
});

// Resume button: shows only if you set a resume link or file name in CONFIG
const resumePath = CONFIG.links.resume || "";
if (/^https?:\/\//i.test(resumePath) || /^[\w.\-\/]+\.pdf$/i.test(resumePath)) {
  document.querySelector(".cta").append(el("a", { class: "btn hot", href: resumePath, target: "_blank", rel: "noopener noreferrer" }, "Get resume"));
}

// ----- About -----
document.getElementById("about-title").textContent = CONFIG.about.title;
const aboutText = document.getElementById("about-text");
CONFIG.about.paragraphs.forEach(p => aboutText.append(el("p", {}, p)));
const facts = document.getElementById("about-facts");
CONFIG.about.facts.forEach(f => facts.append(el("div", {}, el("dt", {}, f[0]), el("dd", {}, f[1]))));
const focus = document.getElementById("about-focus");
CONFIG.about.focus.forEach((f, i) => focus.append(el("div", { class: "card " + colorClass(i + 1) }, el("h3", {}, f.title), el("p", { class: "desc" }, f.text))));

// ----- Skills -----
const skillsGrid = document.getElementById("skills-grid");
CONFIG.skills.forEach((g, i) => skillsGrid.append(el("div", { class: "card skill-card " + colorClass(i) }, el("h3", {}, g.group), fillChips(g.items))));

// ----- Projects -----
const projectsGrid = document.getElementById("projects-grid");
CONFIG.projects.forEach((p, i) => {
  const links = el("div", { class: "links" }, linkButton("Source code", p.github, "light"), linkButton("Live demo", p.demo, "dark"));
  projectsGrid.append(el("article", { class: "card " + colorClass(i) },
    el("h3", {}, p.name),
    el("p", { class: "desc" }, p.description),
    el("div", { class: "meta" },
      el("div", {}, el("span", { class: "meta-label" }, "Problem it solves"), el("p", {}, p.problem)),
      el("div", {}, el("span", { class: "meta-label" }, "My role"), el("p", {}, p.role))
    ),
    fillChips(p.tech),
    links.children.length ? links : null
  ));
});

// ----- Certificates -----
function certCard(c, i) {
  const imageUrl = /^data:image\/(jpeg|png);base64,/.test(c.image || "") ? c.image : safeUrl(c.image);
  const pic = imageUrl
    ? el("div", { class: "cert-img" }, el("img", { src: imageUrl, alt: "Certificate: " + c.name, loading: "lazy" }))
    : el("div", { class: "cert-img" }, "Certificate image");
  const link = linkButton("View certificate", c.link, "light");
  return el("article", { class: "card " + colorClass(i + 2) },
    pic,
    el("h3", {}, c.name),
    el("div", { class: "cert-meta" }, el("span", {}, c.issuer), el("span", {}, c.date)),
    link ? el("div", { class: "links" }, link) : null
  );
}
CONFIG.certificates.python.forEach((c, i) => document.getElementById("certs-python").append(certCard(c, i)));
CONFIG.certificates.other.forEach((c, i) => document.getElementById("certs-other").append(certCard(c, i)));

// ----- Education and experience -----
const expList = document.getElementById("experience-list");
CONFIG.experience.forEach((job, i) => {
  const bullets = el("ul", {});
  job.points.forEach(pt => bullets.append(el("li", {}, pt)));
  expList.append(el("li", { class: "card job " + colorClass(i + 1) },

// ----- Contact -----
document.getElementById("contact-title").textContent = CONFIG.contact.title;
document.getElementById("contact-lead").textContent = CONFIG.contact.lead;

// Copy text to the clipboard. If the browser refuses, select the text so the visitor can copy it.
async function copyText(text, fallbackNode) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (err) {
    if (fallbackNode) {
      const range = document.createRange();
      range.selectNodeContents(fallbackNode);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
    return false;
  }
}

const contactList = document.getElementById("contact-list");
const emailCode = el("code", {}, CONFIG.links.email);
const copyBtn = el("button", { class: "btn small light", type: "button" }, "Copy");
copyBtn.addEventListener("click", async () => {
  const ok = await copyText(CONFIG.links.email, emailCode);
  copyBtn.textContent = ok ? "Copied" : "Press Ctrl+C";
  setTimeout(() => { copyBtn.textContent = "Copy"; }, 2000);
});
contactList.append(el("div", { class: "row" }, el("span", { class: "label" }, "Email"), el("div", { class: "copy-line" }, emailCode, copyBtn)));
[["GitHub", CONFIG.links.github], ["LinkedIn", CONFIG.links.linkedin]].forEach(pair => {
  const href = safeUrl(pair[1]);
  if (!href) return;
  contactList.append(el("div", { class: "row" }, el("span", { class: "label" }, pair[0]),
    el("a", { href: href, target: "_blank", rel: "noopener noreferrer" }, href.replace(/^https?:\/\/(www\.)?/, ""))));
});

// ----- Contact form -----
const form = document.getElementById("contact-form");
const note = document.getElementById("form-note");
const copyMsg = document.getElementById("copy-msg");
let lastMessage = "";

function showNote(text, isError) {
  note.textContent = text;
  note.className = "form-note" + (isError ? " error" : "");
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  const name = document.getElementById("f-name").value.trim();
  const email = document.getElementById("f-email").value.trim();
  const message = document.getElementById("f-message").value.trim();

  // Simple checks
  if (!name || !email || !message) { showNote("Please fill in your name, email and message.", true); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showNote("That email address does not look right. Please check it.", true); return; }

  lastMessage = "From: " + name + " <" + email + ">\n\n" + message;

  // Option 1: send to a form service, if you set formEndpoint in CONFIG
  const endpoint = safeUrl(CONFIG.contact.formEndpoint);
  if (endpoint) {
    try {
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ name: name, email: email, message: message })
      });
      if (res.ok) { form.reset(); showNote("Thank you. Your message was sent.", false); return; }
    } catch (err) { /* fall through to the email option below */ }
  }

  // Option 2: open the visitor's email app with the message filled in
  const subject = "Portfolio message from " + name;
  const href = "mailto:" + CONFIG.links.email + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(lastMessage);
  const a = el("a", { href: href });
  document.body.append(a);
  a.click();
  a.remove();
  copyMsg.hidden = false;
  showNote("Your email app should open with the message ready. If nothing opens, copy the message and email it to " + CONFIG.links.email + ".", false);
});

copyMsg.addEventListener("click", async () => {
  const ok = await copyText(lastMessage, document.getElementById("f-message"));
  showNote(ok ? "Message copied. Paste it into an email to " + CONFIG.links.email + "." : "Could not copy automatically. Select the message text and copy it.", !ok);
});

// ----- Theme button -----
// Switches between light and dark. It starts from the visitor's system setting.
document.getElementById("theme-btn").addEventListener("click", () => {
  const root = document.documentElement;
  const current = root.getAttribute("data-theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.setAttribute("data-theme", current === "dark" ? "light" : "dark");
});
</script>
